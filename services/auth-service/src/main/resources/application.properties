spring.application.name=auth-service
server.port=${SERVER_PORT:8081}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${AUTH_DATABASE_URL:jdbc:postgresql://localhost:5432/pvr_auth}
spring.datasource.username=${DB_USERNAME:pvr}
spring.datasource.password=${DB_PASSWORD:pvr}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
google.client-id=${GOOGLE_CLIENT_ID:}
jwt.secret=${JWT_SECRET:01234567890123456789012345678901}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
resilience4j.retry.instances.googleAuth.max-attempts=2
resilience4j.retry.instances.googleAuth.wait-duration=500ms
resilience4j.retry.instances.googleAuth.retry-exceptions[0]=java.io.IOException
resilience4j.retry.instances.googleAuth.retry-exceptions[1]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.googleAuth.retry-exceptions[2]=com.cinema.movie.pvr.service.ExternalServiceException
resilience4j.circuitbreaker.instances.googleAuth.sliding-window-size=10
resilience4j.circuitbreaker.instances.googleAuth.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.googleAuth.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.googleAuth.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.googleAuth.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.googleAuth.timeout-duration=3s
resilience4j.timelimiter.instances.googleAuth.cancel-running-future=true
