
name: Publish PVR Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - movie-service
          - api-gateway
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"

      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ${{ matrix.service == 'frontend' && './frontend' || '.' }}
      #     file: ${{ matrix.service == 'frontend' && './frontend/Dockerfile' || format('./services/{0}/Dockerfile', matrix.service) }}
      #     push: true
      #     tags: |
      #       ${{ steps.image.outputs.name }}:${{ github.sha }}
      #       ${{ steps.image.outputs.name }}:latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './FrontEnd/bookmymovie' || '.' }}
          file: ${{ matrix.service == 'frontend' && './FrontEnd/bookmymovie/Dockerfile' || format('./services/{0}/Dockerfile', matrix.service) }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
