
name: Publish PVR Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FrontEnd/bookmymovie/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish-frontend:
    name: Publish frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FrontEnd/bookmymovie
          file: ./FrontEnd/bookmymovie/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ayushishankar/pvrclone/frontend:${{ github.sha }}
            ghcr.io/ayushishankar/pvrclone/frontend:latest
