spring.application.name=pvr
spring.config.import=optional:file:src/main/.env[.properties]
server.port=8082
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=0000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
rapidapi.key=${RAPIDAPI_KEY:ba76a25b9bmsh27362ffce4a5949p1e7bf0jsn234046df4928}
rapidapi.host=imdb236.p.rapidapi.com
rapidapi.base-url=https://imdb236.p.rapidapi.com
rapidapi.titles-path=/api/imdb/cast/nm0000190/titles
rapidapi.connect-timeout=2s
rapidapi.read-timeout=5s
google.client-id=${GOOGLE_CLIENT_ID:}
jwt.secret=${JWT_SECRET:01234567890123456789012345678901}
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

resilience4j.retry.instances.rapidApi.max-attempts=3
resilience4j.retry.instances.rapidApi.wait-duration=1s
resilience4j.retry.instances.rapidApi.enable-exponential-backoff=true
resilience4j.retry.instances.rapidApi.exponential-backoff-multiplier=2
resilience4j.retry.instances.rapidApi.retry-exceptions[0]=org.springframework.web.client.RestClientException
resilience4j.retry.instances.rapidApi.retry-exceptions[1]=java.io.IOException
resilience4j.retry.instances.rapidApi.retry-exceptions[2]=java.util.concurrent.TimeoutException

resilience4j.circuitbreaker.instances.rapidApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.rapidApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.rapidApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.rapidApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.rapidApi.permitted-number-of-calls-in-half-open-state=2

resilience4j.timelimiter.instances.rapidApi.timeout-duration=5s
resilience4j.timelimiter.instances.rapidApi.cancel-running-future=true

resilience4j.retry.instances.googleAuth.max-attempts=2
resilience4j.retry.instances.googleAuth.wait-duration=500ms
resilience4j.retry.instances.googleAuth.retry-exceptions[0]=java.io.IOException
resilience4j.retry.instances.googleAuth.retry-exceptions[1]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.googleAuth.retry-exceptions[2]=com.cinema.movie.pvr.service.ExternalServiceException

resilience4j.circuitbreaker.instances.googleAuth.sliding-window-size=10
resilience4j.circuitbreaker.instances.googleAuth.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.googleAuth.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.googleAuth.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.googleAuth.permitted-number-of-calls-in-half-open-state=2

resilience4j.timelimiter.instances.googleAuth.timeout-duration=3s
resilience4j.timelimiter.instances.googleAuth.cancel-running-future=true
